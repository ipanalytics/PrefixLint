name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build release binaries
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          name="prefixlint_${GOOS}_${GOARCH}"
          binary="prefixlint"

          if [ "$GOOS" = "windows" ]; then
            binary="prefixlint.exe"
          fi

          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "dist/$binary" \
            ./cmd/prefixlint

          cd dist

          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip "${name}.zip" "$binary" ../README.md ../LICENSE
          else
            tar -czf "${name}.tar.gz" "$binary" ../README.md ../LICENSE
          fi

          rm "$binary"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prefixlint_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: PrefixLint ${{ inputs.tag }}
          body: |
            Release binaries for PrefixLint.

            Install with Go:

            ```sh
            go install github.com/ipanalytics/PrefixLint/cmd/prefixlint@${{ inputs.tag }}
            ```

            Artifacts include Linux, macOS, and Windows builds with SHA-256 checksums.
          files: |
            dist/*
